name: jev-direction-canary

on:
  workflow_dispatch:
    inputs:
      confirm_spend:
        description: I understand this makes at most 12 fresh Jev requests under a hard $0.0015 ledger cap
        required: true
        type: boolean
        default: false
      resume_run_id:
        description: Optional failed jev-direction-canary run ID to resume from its partial cache
        required: false
        default: ""
      resume_dashboard_verified:
        description: I checked TypeSafe billing for the failed canary before resuming
        required: false
        type: boolean
        default: false
      resume_dashboard_request_delta:
        description: Exact TypeSafe request-count increase caused by the failed canary
        required: false
        default: "0"
      resume_dashboard_input_token_delta:
        description: Exact TypeSafe input-token increase caused by the failed canary
        required: false
        default: "0"

permissions:
  contents: read
  actions: read

jobs:
  canary:
    if: ${{ inputs.confirm_spend == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c7ae2796ea6c7e01a59522177b150e8c99c34c2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Download durable market and already-paid Jev reference bundle
        uses: actions/download-artifact@v4
        with:
          pattern: jev-credit-reference-v1
          path: data/canary
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35420536540

      - name: Verify durable frozen market and reference artifact
        run: |
          test -s data/canary/universe/universe.json
          test -s data/canary/reference-full-jev-cache.jsonl
          test -s data/canary/reference-full-jev-summary.json
          jq -e '
            .requestedSymbols == ["BTCUSDT","ETHUSDT","SOLUSDT"] and
            .interval == "1h" and
            .start == "2024-01-01" and
            .end == "2026-09-01"
          ' data/canary/universe/universe.json >/dev/null
          jq -e '
            .cells | any(.profile == "path" and .horizonBars == 8 and .status == "complete")
          ' data/canary/reference-full-jev-summary.json >/dev/null

      - name: Download optional failed canary cache
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: jev-direction-canary-failed-${{ inputs.resume_run_id }}
          path: resume
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Restore partial canary cache and remaining lifetime budget
        run: |
          set -euo pipefail
          MAX_REQ=12
          MAX_TOK=30000
          USED_REQ=0
          USED_TOK=0
          if [ -n "${{ inputs.resume_run_id }}" ]; then
            if [ "${{ inputs.resume_dashboard_verified }}" != "true" ]; then
              echo "Canary resume requires explicit TypeSafe dashboard verification."
              exit 1
            fi
            USED_REQ="${{ inputs.resume_dashboard_request_delta }}"
            USED_TOK="${{ inputs.resume_dashboard_input_token_delta }}"
            [[ "$USED_REQ" =~ ^[0-9]+$ ]]
            [[ "$USED_TOK" =~ ^[0-9]+$ ]]
            if [ "$USED_REQ" -gt "$MAX_REQ" ] || [ "$USED_TOK" -gt "$MAX_TOK" ]; then
              echo "Failed canary already exceeded its lifetime cap."
              exit 1
            fi
            PARTIAL="$(find resume -type f -name 'jev-direction-cache.jsonl' -print -quit)"
            test -n "$PARTIAL"
            cp "$PARTIAL" data/canary/jev-direction-cache.jsonl
          fi
          REM_REQ=$((MAX_REQ - USED_REQ))
          REM_TOK=$((MAX_TOK - USED_TOK))
          if [ "$REM_REQ" -le 0 ] || [ "$REM_TOK" -lt 2000 ]; then
            echo "No safe paid budget remains for this canary."
            exit 1
          fi
          echo "CANARY_REMAINING_REQ=$REM_REQ" >> "$GITHUB_ENV"
          echo "CANARY_REMAINING_TOK=$REM_TOK" >> "$GITHUB_ENV"
          echo "Canary lifetime cap remaining: $REM_REQ requests and $REM_TOK input tokens."

      - name: Refuse duplicate paid canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=jev-direction-canary-v1" --jq '.total_count')"
          if [ "$COUNT" != "0" ]; then
            echo "jev-direction-canary-v1 already exists; refusing duplicate paid canary"
            exit 1
          fi

      - name: Zero-call spend plan
        run: |
          bun run research/jev-spend-plan.ts data/canary/universe/universe.json \
            --horizon=8 \
            --decision-every=8 \
            --tokens-per-request=2000 | tee data/canary/spend-plan.txt

      - name: Run 12-request direction-only Jev canary
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TYPESAFE_AI_API_KEY"
          bun run research/safe-jev-direction-probe.ts data/canary/universe/universe.json \
            --horizon=8 \
            --profile=lean \
            --decision-every=8 \
            --sample=12 \
            --max-requests="$CANARY_REMAINING_REQ" \
            --max-input-tokens="$CANARY_REMAINING_TOK" \
            --reserve-input-tokens=2000 \
            --max-usd=0.0015 \
            --usd-per-mtok=0.042 \
            --concurrency=1 \
            --reference-cache=data/canary/reference-full-jev-cache.jsonl \
            --reference-profile=path \
            --reference-model=jev \
            --cache=data/canary/jev-direction-cache.jsonl \
            --out=data/canary/jev-direction-canary.json | tee data/canary/canary-output.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jev-direction-canary-v1
          path: |
            data/canary/universe/
            data/canary/spend-plan.txt
            data/canary/jev-direction-cache.jsonl
            data/canary/jev-direction-canary.json
            data/canary/canary-output.txt
            data/canary/reference-full-jev-cache.jsonl
            data/canary/reference-full-jev-summary.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jev-direction-canary-failed-${{ github.run_id }}
          path: |
            data/
          retention-days: 14

