name: jev-direction-canary

on:
  workflow_dispatch:
    inputs:
      confirm_spend:
        description: I understand this makes at most 12 fresh Jev requests under a hard $0.0015 ledger cap
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  canary:
    if: ${{ inputs.confirm_spend == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c7ae2796ea6c7e01a59522177b150e8c99c34c2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Download durable market and already-paid Jev reference bundle
        uses: actions/download-artifact@v4
        with:
          pattern: jev-credit-reference-v1
          path: data/canary
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35420536540

      - name: Verify durable frozen market and reference artifact
        run: |
          test -s data/canary/universe/universe.json
          test -s data/canary/reference-full-jev-cache.jsonl
          test -s data/canary/reference-full-jev-summary.json
          jq -e '
            .requestedSymbols == ["BTCUSDT","ETHUSDT","SOLUSDT"] and
            .interval == "1h" and
            .start == "2024-01-01" and
            .end == "2026-09-01"
          ' data/canary/universe/universe.json >/dev/null
          jq -e '
            .cells | any(.profile == "path" and .horizonBars == 8 and .status == "complete")
          ' data/canary/reference-full-jev-summary.json >/dev/null

      - name: Refuse duplicate paid canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=jev-direction-canary-v1" --jq '.total_count')"
          if [ "$COUNT" != "0" ]; then
            echo "jev-direction-canary-v1 already exists; refusing duplicate paid canary"
            exit 1
          fi

      - name: Zero-call spend plan
        run: |
          bun run research/jev-spend-plan.ts data/canary/universe/universe.json \
            --horizon=8 \
            --decision-every=8 \
            --tokens-per-request=2000 | tee data/canary/spend-plan.txt

      - name: Run 12-request direction-only Jev canary
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TYPESAFE_AI_API_KEY"
          bun run research/safe-jev-direction-probe.ts data/canary/universe/universe.json \
            --horizon=8 \
            --profile=lean \
            --decision-every=8 \
            --sample=12 \
            --max-requests=12 \
            --max-input-tokens=30000 \
            --reserve-input-tokens=2000 \
            --max-usd=0.0015 \
            --usd-per-mtok=0.042 \
            --concurrency=1 \
            --reference-cache=data/canary/reference-full-jev-cache.jsonl \
            --reference-profile=path \
            --reference-model=jev \
            --cache=data/canary/jev-direction-cache.jsonl \
            --out=data/canary/jev-direction-canary.json | tee data/canary/canary-output.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jev-direction-canary-v1
          path: |
            data/canary/universe/
            data/canary/spend-plan.txt
            data/canary/jev-direction-cache.jsonl
            data/canary/jev-direction-canary.json
            data/canary/canary-output.txt
            data/canary/reference-full-jev-cache.jsonl
            data/canary/reference-full-jev-summary.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jev-direction-canary-failed-${{ github.run_id }}
          path: |
            data/
          retention-days: 14

