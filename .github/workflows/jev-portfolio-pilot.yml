name: jev-portfolio-pilot

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated Binance spot symbols
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT"
      interval:
        description: Binance kline interval
        required: true
        default: "15m"
      start:
        description: Historical start date
        required: true
        default: "2025-01-01"
      end:
        description: Historical end date
        required: true
        default: "2025-02-01"
      horizons:
        description: Forecast horizons in bars
        required: true
        default: "6,12"
      profiles:
        description: Jev input profiles
        required: true
        default: "technical,path,cross,full"
      decision_every:
        description: Evaluate every N synchronized bars
        required: true
        default: "8"
      top_n:
        description: Initial maximum simultaneously selected assets
        required: true
        default: "2"
      max_asset:
        description: Initial maximum absolute exposure per asset
        required: true
        default: "0.5"
      concurrency:
        description: Maximum concurrent Jev API calls
        required: true
        default: "4"
      max_new_evals:
        description: Hard cap across all fresh Jev calls
        required: true
        default: "8000"
      probe_run_id:
        description: Optional completed jev-portfolio-probe run ID whose cache should be reused
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/replay-lab
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Require TypeSafe secret
        run: |
          if [ -z "$TYPESAFE_AI_API_KEY" ]; then
            echo "TYPESAFE_AI_API_KEY repository secret is not configured"
            exit 1
          fi
      - name: Download public crypto universe
        if: ${{ inputs.probe_run_id == '' }}
        run: |
          bun run scripts/download-binance-universe.ts \
            --symbols="${{ inputs.symbols }}" \
            --interval="${{ inputs.interval }}" \
            --start="${{ inputs.start }}" \
            --end="${{ inputs.end }}" \
            --out-dir=data/market/universe \
            --manifest=data/market/universe/universe.json
      - name: Download optional portfolio probe artifact
        if: ${{ inputs.probe_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: jev-portfolio-probe-${{ inputs.probe_run_id }}
          path: probe
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.probe_run_id }}
      - name: Reuse exact verified portfolio probe universe and cache
        if: ${{ inputs.probe_run_id != '' }}
        run: |
          test -s probe/market/universe/universe.json
          test -s probe/portfolio-probe-summary.json
          test -s probe/portfolio-probe-cache.jsonl
          jq -e \
            --arg symbols "${{ inputs.symbols }}" \
            --arg interval "${{ inputs.interval }}" \
            --arg start "${{ inputs.start }}" \
            --arg end "${{ inputs.end }}" \
            '.requestedSymbols == ($symbols | split(",")) and .interval == $interval and .start == $start and .end == $end' \
            probe/market/universe/universe.json >/dev/null
          mkdir -p data/market
          cp -R probe/market/universe data/market/universe
          ACTUAL="$(bun -e 'import { fingerprintUniverse } from "./research/universe"; console.log(fingerprintUniverse("data/market/universe/universe.json").combinedSha256)')"
          PROBE="$(jq -r '.fingerprint.combinedSha256' probe/portfolio-probe-summary.json)"
          if [ "$ACTUAL" != "$PROBE" ]; then
            echo "Portfolio probe universe fingerprint does not match copied universe"
            exit 1
          fi
          cp probe/portfolio-probe-cache.jsonl data/portfolio-pilot-cache.jsonl
          echo "Reusing exact portfolio universe and cache from probe run ${{ inputs.probe_run_id }}"
      - name: Run development-only Jev portfolio pilot
        run: |
          bun run research/portfolio-pilot.ts data/market/universe/universe.json \
            --model=jev \
            --require-complete-grid=true \
            --concurrency="${{ inputs.concurrency }}" \
            --horizons="${{ inputs.horizons }}" \
            --profiles="${{ inputs.profiles }}" \
            --decision-every="${{ inputs.decision_every }}" \
            --top-n="${{ inputs.top_n }}" \
            --max-gross=1 \
            --max-asset="${{ inputs.max_asset }}" \
            --allow-short=false \
            --max-new-evals="${{ inputs.max_new_evals }}" \
            --cache=data/portfolio-pilot-cache.jsonl \
            --out=data/portfolio-pilot-summary.json
      - name: Tune shared-bankroll apparatus from cached Jev probabilities
        run: |
          bun run research/tune-portfolio-apparatus.ts data/market/universe/universe.json \
            --pilot=data/portfolio-pilot-summary.json \
            --cache=data/portfolio-pilot-cache.jsonl \
            --grid=full \
            --out=data/portfolio-apparatus-selection.json
      - name: Freeze only if validation qualification passes
        run: |
          bun run research/freeze-portfolio.ts data/market/universe/universe.json \
            --selection=data/portfolio-apparatus-selection.json \
            --out=data/portfolio-apparatus-freeze.json
      - name: Zero-spend sealed-test preflight
        if: ${{ success() }}
        run: |
          bun run research/portfolio-sealed-preflight.ts data/portfolio-apparatus-freeze.json \
            --manifest=data/market/universe/universe.json \
            --cache=data/portfolio-pilot-cache.jsonl | tee data/portfolio-sealed-preflight.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-portfolio-pilot-${{ github.run_id }}
          path: |
            data/market/universe/
            data/portfolio-pilot-cache.jsonl
            data/portfolio-pilot-summary.json
            data/portfolio-apparatus-selection.json
            data/portfolio-apparatus-freeze.json
            data/portfolio-sealed-preflight.txt
          retention-days: 30
