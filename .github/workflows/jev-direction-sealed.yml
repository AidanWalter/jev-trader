name: jev-direction-sealed

on:
  workflow_dispatch:
    inputs:
      development_run_id:
        description: Successful qualified jev-direction-development run ID
        required: true
      dashboard_verified:
        description: I checked TypeSafe billing for development and it matched the artifact closely
        required: true
        type: boolean
        default: false
      dashboard_request_delta:
        description: Exact TypeSafe request-count increase caused by the development run
        required: true
      dashboard_input_token_delta:
        description: TypeSafe input-token increase caused by the development run
        required: true
      confirm_spend:
        description: I approve this one-time sealed test under a hard $0.15 ledger cap
        required: true
        type: boolean
        default: false
      resume_run_id:
        description: Optional failed jev-direction-sealed run ID to resume from its partial cache
        required: false
        default: ""
      resume_dashboard_verified:
        description: I checked TypeSafe billing for the failed sealed attempt before resuming
        required: false
        type: boolean
        default: false
      resume_dashboard_request_delta:
        description: Exact TypeSafe request-count increase caused by the failed sealed attempt
        required: false
        default: "0"
      resume_dashboard_input_token_delta:
        description: Exact TypeSafe input-token increase caused by the failed sealed attempt
        required: false
        default: "0"

permissions:
  contents: read
  actions: read

jobs:
  sealed:
    if: ${{ inputs.dashboard_verified == true && inputs.confirm_spend == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/replay-lab
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Download exact qualified development artifact
        uses: actions/download-artifact@v4
        with:
          pattern: jev-direction-development-sample-*
          path: prior
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.development_run_id }}

      - name: Verify frozen apparatus identity and qualification
        run: |
          set -euo pipefail
          FREEZE="$(find prior -name freeze.json -print -quit)"
          SELECTION="$(find prior -name selection.json -print -quit)"
          PILOT="$(find prior -name pilot.json -print -quit)"
          CACHE="$(find prior -name jev-direction-cache.jsonl -print -quit)"
          AUDIT="$(find prior -name validation-audit.json -print -quit)"
          MANIFEST="$(find prior -path '*/universe/universe.json' -print -quit)"
          test -n "$FREEZE"
          test -n "$SELECTION"
          test -n "$PILOT"
          test -n "$CACHE"
          test -n "$AUDIT"
          test -n "$MANIFEST"
          jq -e '
            .qualification.passed == true and
            .evaluatorKind == "jev-direction" and
            .chosen.profile == "lean" and
            .chosen.horizonBars == 8
          ' "$SELECTION" >/dev/null
          jq -e '.passed == true and .positiveSegments == .segmentCount' "$AUDIT" >/dev/null
          jq -e '
            .modelName == "jev-direction" and
            .profiles == ["lean"] and
            .horizons == [8] and
            .decisionEveryBars == 8 and
            .spend.estimatedUsd <= 0.57
          ' "$PILOT" >/dev/null
          OBS_REQ="${{ inputs.dashboard_request_delta }}"
          OBS_TOK="${{ inputs.dashboard_input_token_delta }}"
          [[ "$OBS_REQ" =~ ^[0-9]+$ ]]
          [[ "$OBS_TOK" =~ ^[0-9]+$ ]]
          EXP_REQ="$(jq -r '.spend.requestsStarted' "$PILOT")"
          EXP_TOK="$(jq -r '.spend.inputTokens' "$PILOT")"
          if [ "$OBS_REQ" -ne "$EXP_REQ" ]; then
            echo "TypeSafe request delta $OBS_REQ does not equal development artifact request count $EXP_REQ"
            exit 1
          fi
          LOW=$((EXP_TOK * 95 / 100))
          HIGH=$((EXP_TOK * 105 / 100 + 100))
          if [ "$OBS_TOK" -lt "$LOW" ] || [ "$OBS_TOK" -gt "$HIGH" ]; then
            echo "TypeSafe input-token delta $OBS_TOK does not reconcile with development artifact $EXP_TOK (allowed $LOW..$HIGH)"
            exit 1
          fi
          echo "Provider billing reconciled: $OBS_REQ requests and $OBS_TOK input tokens."
          mkdir -p data/sealed
          cp -R "$(dirname "$MANIFEST")" data/sealed/universe
          cp "$FREEZE" data/sealed/freeze.json
          cp "$SELECTION" data/sealed/selection.json
          cp "$AUDIT" data/sealed/validation-audit.json
          cp "$PILOT" data/sealed/pilot.json
          cp "$CACHE" data/sealed/jev-direction-cache.jsonl

      - name: Download optional failed sealed cache
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: jev-direction-sealed-failed-${{ inputs.resume_run_id }}
          path: resume
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Restore partial sealed cache and compute remaining lifetime stage budget
        run: |
          set -euo pipefail
          MAX_REQ=1752
          MAX_TOK=3504000
          USED_REQ=0
          USED_TOK=0
          if [ -n "${{ inputs.resume_run_id }}" ]; then
            if [ "${{ inputs.resume_dashboard_verified }}" != "true" ]; then
              echo "Resume requires explicit provider-dashboard verification."
              exit 1
            fi
            USED_REQ="${{ inputs.resume_dashboard_request_delta }}"
            USED_TOK="${{ inputs.resume_dashboard_input_token_delta }}"
            [[ "$USED_REQ" =~ ^[0-9]+$ ]]
            [[ "$USED_TOK" =~ ^[0-9]+$ ]]
            if [ "$USED_REQ" -gt "$MAX_REQ" ] || [ "$USED_TOK" -gt "$MAX_TOK" ]; then
              echo "Failed attempt already exceeded the lifetime sealed-stage cap."
              exit 1
            fi
            PARTIAL="$(find resume -type f -name 'jev-direction-cache.jsonl' -print -quit)"
            test -n "$PARTIAL"
            cp "$PARTIAL" data/sealed/jev-direction-cache.jsonl
          fi
          REM_REQ=$((MAX_REQ - USED_REQ))
          REM_TOK=$((MAX_TOK - USED_TOK))
          if [ "$REM_REQ" -le 0 ] || [ "$REM_TOK" -lt 2000 ]; then
            echo "No safe paid budget remains for this sealed stage."
            exit 1
          fi
          echo "SEALED_REMAINING_REQ=$REM_REQ" >> "$GITHUB_ENV"
          echo "SEALED_REMAINING_TOK=$REM_TOK" >> "$GITHUB_ENV"
          echo "Sealed lifetime cap remaining: $REM_REQ requests and $REM_TOK input tokens."

      - name: Zero-spend sealed preflight
        run: |
          set -euo pipefail
          bun run research/portfolio-sealed-preflight.ts data/sealed/freeze.json \
            --manifest=data/sealed/universe/universe.json \
            --cache=data/sealed/jev-direction-cache.jsonl | tee data/sealed/preflight.txt
          MISSING="$(sed -n 's/^new Jev calls required //p' data/sealed/preflight.txt | tail -1)"
          test -n "$MISSING"
          if [ "$MISSING" -gt 1752 ]; then
            echo "Sealed test needs $MISSING fresh calls, above the 1752-call hard ceiling."
            exit 1
          fi
          echo "Preflight accepted $MISSING missing sealed states. No Jev call has been made."

      - name: Refuse duplicate sealed spend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="jev-direction-sealed-development-${{ inputs.development_run_id }}"
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME" --jq '.total_count')"
          if [ "$COUNT" != "0" ]; then
            echo "$NAME already exists; refusing duplicate sealed spend"
            exit 1
          fi

      - name: Run one-time frozen sealed test
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TYPESAFE_AI_API_KEY"
          bun run research/run-portfolio-sealed-test.ts data/sealed/freeze.json \
            --manifest=data/sealed/universe/universe.json \
            --cache=data/sealed/jev-direction-cache.jsonl \
            --concurrency=1 \
            --max-new-evals="$SEALED_REMAINING_REQ" \
            --max-paid-requests="$SEALED_REMAINING_REQ" \
            --max-input-tokens="$SEALED_REMAINING_TOK" \
            --reserve-tokens-per-request=2000 \
            --max-usd=0.15 \
            --usd-per-mtok=0.042 \
            --out=data/sealed/result.json | tee data/sealed/output.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jev-direction-sealed-development-${{ inputs.development_run_id }}
          path: |
            data/sealed/freeze.json
            data/sealed/selection.json
            data/sealed/validation-audit.json
            data/sealed/pilot.json
            data/sealed/jev-direction-cache.jsonl
            data/sealed/preflight.txt
            data/sealed/output.txt
            data/sealed/result.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jev-direction-sealed-failed-${{ github.run_id }}
          path: |
            data/
          retention-days: 14

