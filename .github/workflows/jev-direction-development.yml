name: jev-direction-development

on:
  workflow_dispatch:
    inputs:
      sample_run_id:
        description: Successful jev-direction-sample-1000 run ID
        required: true
      dashboard_verified:
        description: I checked TypeSafe billing for the 1000-state sample and it matched the artifact closely
        required: true
        type: boolean
        default: false
      dashboard_request_delta:
        description: Exact TypeSafe request-count increase caused by the 1000-state sample
        required: true
      dashboard_input_token_delta:
        description: TypeSafe input-token increase caused by the 1000-state sample
        required: true
      confirm_spend:
        description: I approve one fixed direction-only development pass under a hard $0.505 ledger cap
        required: true
        type: boolean
        default: false
      resume_run_id:
        description: Optional failed jev-direction-development run ID to resume from its partial cache
        required: false
        default: ""
      resume_dashboard_verified:
        description: I checked TypeSafe billing for the failed development attempt before resuming
        required: false
        type: boolean
        default: false
      resume_dashboard_request_delta:
        description: Exact TypeSafe request-count increase caused by the failed development attempt
        required: false
        default: "0"
      resume_dashboard_input_token_delta:
        description: Exact TypeSafe input-token increase caused by the failed development attempt
        required: false
        default: "0"

permissions:
  contents: read
  actions: read

jobs:
  development:
    if: ${{ inputs.dashboard_verified == true && inputs.confirm_spend == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c7ae2796ea6c7e01a59522177b150e8c99c34c2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Download exact verified sample artifact
        uses: actions/download-artifact@v4
        with:
          pattern: jev-direction-sample1000-stage240-*
          path: prior
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.sample_run_id }}

      - name: Verify sample identity and signal gate
        run: |
          set -euo pipefail
          RESULT="$(find prior -name result.json -print -quit)"
          CACHE="$(find prior -name jev-direction-cache.jsonl -print -quit)"
          MANIFEST="$(find prior -path '*/universe/universe.json' -print -quit)"
          test -n "$RESULT"
          test -n "$CACHE"
          test -n "$MANIFEST"
          jq -e '
            .version == "safe-jev-direction-probe-v1" and
            .horizonBars == 8 and
            .profile == "lean" and
            .decisionEveryBars == 8 and
            .sampleCount == 1000 and
            .preCachedSampleStates >= 240 and
            .freshStatesRequired <= 760 and
            .budget.requestsStarted <= 760 and
            .budget.estimatedUsd <= 0.065 and
            .metrics.avgInputTokens <= 1600 and
            .metrics.brier < 0.6666667 and
            .metrics.nonFlatCount >= 150 and
            (
              (.metrics.confidenceGates | any(
                .threshold >= 0.55 and
                .n >= 100 and
                .netCalledBpsPerState > 2 and
                .positiveTimeQuartiles >= 3 and
                .positiveSymbols >= 2
              )) or
              (.metrics.edgeGates | any(
                .threshold >= 0.20 and
                .n >= 100 and
                .netCalledBpsPerState > 2 and
                .positiveTimeQuartiles >= 3 and
                .positiveSymbols >= 2
              ))
            )
          ' "$RESULT" >/dev/null
          OBS_REQ="${{ inputs.dashboard_request_delta }}"
          OBS_TOK="${{ inputs.dashboard_input_token_delta }}"
          [[ "$OBS_REQ" =~ ^[0-9]+$ ]]
          [[ "$OBS_TOK" =~ ^[0-9]+$ ]]
          EXP_REQ="$(jq -r '.budget.requestsStarted' "$RESULT")"
          EXP_TOK="$(jq -r '.budget.inputTokens' "$RESULT")"
          if [ "$OBS_REQ" -ne "$EXP_REQ" ]; then
            echo "TypeSafe request delta $OBS_REQ does not equal artifact request count $EXP_REQ"
            exit 1
          fi
          LOW=$((EXP_TOK * 95 / 100))
          HIGH=$((EXP_TOK * 105 / 100 + 100))
          if [ "$OBS_TOK" -lt "$LOW" ] || [ "$OBS_TOK" -gt "$HIGH" ]; then
            echo "TypeSafe input-token delta $OBS_TOK does not reconcile with artifact $EXP_TOK (allowed $LOW..$HIGH)"
            exit 1
          fi
          echo "Provider billing reconciled: $OBS_REQ requests and $OBS_TOK input tokens."
          mkdir -p data/dev
          cp -R "$(dirname "$MANIFEST")" data/dev/universe
          cp "$CACHE" data/dev/jev-direction-cache.jsonl
          cp "$RESULT" data/dev/sample.json

      - name: Download optional failed development cache
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: jev-direction-development-failed-${{ inputs.resume_run_id }}
          path: resume
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Restore partial cache and compute remaining lifetime stage budget
        run: |
          set -euo pipefail
          MAX_REQ=5996
          MAX_TOK=11992000
          USED_REQ=0
          USED_TOK=0
          if [ -n "${{ inputs.resume_run_id }}" ]; then
            if [ "${{ inputs.resume_dashboard_verified }}" != "true" ]; then
              echo "Resume requires explicit provider-dashboard verification."
              exit 1
            fi
            USED_REQ="${{ inputs.resume_dashboard_request_delta }}"
            USED_TOK="${{ inputs.resume_dashboard_input_token_delta }}"
            [[ "$USED_REQ" =~ ^[0-9]+$ ]]
            [[ "$USED_TOK" =~ ^[0-9]+$ ]]
            if [ "$USED_REQ" -gt "$MAX_REQ" ] || [ "$USED_TOK" -gt "$MAX_TOK" ]; then
              echo "Failed attempt already exceeded the lifetime development-stage cap."
              exit 1
            fi
            PARTIAL="$(find resume -type f -name 'jev-direction-cache.jsonl' -print -quit)"
            test -n "$PARTIAL"
            cp "$PARTIAL" data/dev/jev-direction-cache.jsonl
          fi
          REM_REQ=$((MAX_REQ - USED_REQ))
          REM_TOK=$((MAX_TOK - USED_TOK))
          if [ "$REM_REQ" -le 0 ] || [ "$REM_TOK" -lt 2000 ]; then
            echo "No safe paid budget remains for this development stage."
            exit 1
          fi
          echo "DEV_REMAINING_REQ=$REM_REQ" >> "$GITHUB_ENV"
          echo "DEV_REMAINING_TOK=$REM_TOK" >> "$GITHUB_ENV"
          echo "Development lifetime cap remaining: $REM_REQ requests and $REM_TOK input tokens."

      - name: Zero-call full development spend plan
        run: |
          bun run research/jev-spend-plan.ts data/dev/universe/universe.json \
            --horizon=8 \
            --decision-every=8 \
            --tokens-per-request=2000 | tee data/dev/spend-plan.txt
          echo "Hard paid limits: 5996 fresh requests, 11,992,000 input tokens, $0.505."
          echo "The 1000 nested sample states must already be cache hits; otherwise the pilot refuses to start."

      - name: Zero-call development cache preflight
        run: |
          bun run research/jev-development-preflight.ts data/dev/universe/universe.json \
            --cache=data/dev/jev-direction-cache.jsonl \
            --model=jev-direction \
            --profile=lean \
            --horizon=8 \
            --decision-every=8 \
            --min-cached=1000 \
            --max-missing=5996 \
            --out=data/dev/development-preflight.json
          jq -e '
            .totalStates == 6996 and
            .cachedStates >= 1000 and
            .missingStates <= 5996
          ' data/dev/development-preflight.json >/dev/null

      - name: Refuse duplicate paid development expansion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="jev-direction-development-sample-${{ inputs.sample_run_id }}"
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME" --jq '.total_count')"
          if [ "$COUNT" != "0" ]; then
            echo "$NAME already exists; refusing duplicate paid development run"
            exit 1
          fi

      - name: Fill one fixed Jev development apparatus
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TYPESAFE_AI_API_KEY"
          bun run research/portfolio-pilot.ts data/dev/universe/universe.json \
            --model=jev-direction \
            --horizons=8 \
            --profiles=lean \
            --decision-every=8 \
            --top-n=2 \
            --max-gross=1 \
            --max-asset=0.5 \
            --allow-short=false \
            --require-complete-grid=true \
            --concurrency=1 \
            --max-new-evals="$DEV_REMAINING_REQ" \
            --max-paid-requests="$DEV_REMAINING_REQ" \
            --max-input-tokens="$DEV_REMAINING_TOK" \
            --reserve-tokens-per-request=2000 \
            --max-usd=0.505 \
            --usd-per-mtok=0.042 \
            --cache=data/dev/jev-direction-cache.jsonl \
            --out=data/dev/pilot.json | tee data/dev/pilot-output.txt

      - name: Tune deterministic policy from cached Jev probabilities
        run: |
          bun run research/tune-portfolio-apparatus.ts data/dev/universe/universe.json \
            --pilot=data/dev/pilot.json \
            --cache=data/dev/jev-direction-cache.jsonl \
            --grid=full \
            --direction-only=true \
            --out=data/dev/selection.json | tee data/dev/tune-output.txt

      - name: Freeze only a qualified apparatus
        run: |
          jq -e '.qualification.passed == true' data/dev/selection.json >/dev/null
          bun run research/freeze-portfolio.ts data/dev/universe/universe.json \
            --selection=data/dev/selection.json \
            --out=data/dev/freeze.json

      - name: Independent four-segment validation audit
        run: |
          bun run research/audit-portfolio-validation.ts data/dev/freeze.json \
            --manifest=data/dev/universe/universe.json \
            --cache=data/dev/jev-direction-cache.jsonl \
            --segments=4 \
            --min-positive-segments=4 \
            --out=data/dev/validation-audit.json

      - name: Zero-spend sealed preflight only
        run: |
          bun run research/portfolio-sealed-preflight.ts data/dev/freeze.json \
            --manifest=data/dev/universe/universe.json \
            --cache=data/dev/jev-direction-cache.jsonl | tee data/dev/sealed-preflight.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jev-direction-development-sample-${{ inputs.sample_run_id }}
          path: |
            data/dev/universe/
            data/dev/sample.json
            data/dev/spend-plan.txt
            data/dev/development-preflight.json
            data/dev/jev-direction-cache.jsonl
            data/dev/pilot.json
            data/dev/pilot-output.txt
            data/dev/selection.json
            data/dev/tune-output.txt
            data/dev/freeze.json
            data/dev/validation-audit.json
            data/dev/sealed-preflight.txt
          retention-days: 60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jev-direction-development-failed-${{ github.run_id }}
          path: |
            data/
          retention-days: 14

