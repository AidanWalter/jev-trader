name: jev-direction-sample-48

on:
  workflow_dispatch:
    inputs:
      canary_run_id:
        description: Successful jev-direction-canary run ID whose TypeSafe dashboard usage you personally verified
        required: true
      dashboard_verified:
        description: I checked TypeSafe billing for the 12-state canary and it matched the artifact closely
        required: true
        type: boolean
        default: false
      confirm_spend:
        description: I approve at most 36 fresh Jev requests under a hard $0.004 ledger cap
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  sample48:
    if: ${{ inputs.dashboard_verified == true && inputs.confirm_spend == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/replay-lab
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Download verified 12-state canary
        uses: actions/download-artifact@v4
        with:
          pattern: jev-direction-canary-v1
          path: prior
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.canary_run_id }}

      - name: Download already-paid full-Jev reference cache
        uses: actions/download-artifact@v4
        with:
          pattern: generation2-jev-pilot-35389450141
          path: reference
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35389450141

      - name: Verify canary and restore exact cache
        run: |
          set -euo pipefail
          RESULT="$(find prior -name jev-direction-canary.json -print -quit)"
          CACHE="$(find prior -name jev-direction-cache.jsonl -print -quit)"
          MANIFEST="$(find prior -path '*/universe/universe.json' -print -quit)"
          REFERENCE_CACHE="$(find reference -type f -name '*cache*.jsonl' -print -quit)"
          test -n "$RESULT"
          test -n "$CACHE"
          test -n "$MANIFEST"
          test -n "$REFERENCE_CACHE"
          jq -e '
            .version == "safe-jev-direction-probe-v1" and
            .horizonBars == 8 and
            .profile == "lean" and
            .decisionEveryBars == 8 and
            .sampleCount == 12 and
            .budget.requestsStarted <= 12 and
            .budget.estimatedUsd <= 0.0015
          ' "$RESULT" >/dev/null
          mkdir -p data/sample48
          cp -R "$(dirname "$MANIFEST")" data/sample48/universe
          cp "$CACHE" data/sample48/jev-direction-cache.jsonl
          cp "$RESULT" data/sample48/canary.json
          cp "$REFERENCE_CACHE" data/sample48/reference-full-jev-cache.jsonl

      - name: Refuse duplicate 48-state spend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="jev-direction-sample48-canary-${{ inputs.canary_run_id }}"
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME" --jq '.total_count')"
          if [ "$COUNT" != "0" ]; then
            echo "$NAME already exists; refusing duplicate paid sample"
            exit 1
          fi

      - name: Run nested 48-state Jev direction sample
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TYPESAFE_AI_API_KEY"
          bun run research/safe-jev-direction-probe.ts data/sample48/universe/universe.json \
            --horizon=8 \
            --profile=lean \
            --decision-every=8 \
            --sample=48 \
            --min-cache-hits=12 \
            --max-requests=36 \
            --max-input-tokens=80000 \
            --reserve-input-tokens=2000 \
            --max-usd=0.004 \
            --usd-per-mtok=0.042 \
            --concurrency=1 \
            --reference-cache=data/sample48/reference-full-jev-cache.jsonl \
            --reference-profile=path \
            --reference-model=jev \
            --cache=data/sample48/jev-direction-cache.jsonl \
            --out=data/sample48/result.json | tee data/sample48/output.txt

      - name: Verify true nested expansion
        run: |
          jq -e --slurpfile canary data/sample48/canary.json '
            .sampleCount == 48 and
            .preCachedSampleStates >= 12 and
            .freshStatesRequired <= 36 and
            .budget.requestsStarted <= 36 and
            (.sampleStateIds[0:12] == $canary[0].sampleStateIds)
          ' data/sample48/result.json >/dev/null

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jev-direction-sample48-canary-${{ inputs.canary_run_id }}
          path: |
            data/sample48/universe/
            data/sample48/canary.json
            data/sample48/jev-direction-cache.jsonl
            data/sample48/result.json
            data/sample48/output.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jev-direction-sample48-failed-${{ github.run_id }}
          path: |
            data/
          retention-days: 14
