name: jev-workflow-safety

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit every workflow that can see the Jev secret
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          root = Path(".github/workflows")
          allowed = {
              "jev-direction-canary.yml",
              "jev-direction-sample-48.yml",
              "jev-direction-sample.yml",
              "jev-direction-sample-1000.yml",
              "jev-direction-development.yml",
              "jev-direction-sealed.yml",
          }
          exact = {
              "jev-direction-canary.yml": [
                  "--horizon=8", "--profile=lean", "--decision-every=8",
                  "--sample=12", "--max-requests=12", "--max-input-tokens=30000",
                  "--reserve-input-tokens=2000", "--max-usd=0.0015", "--concurrency=1",
              ],
              "jev-direction-sample-48.yml": [
                  "--horizon=8", "--profile=lean", "--decision-every=8",
                  "--sample=48", "--min-cache-hits=12", "--max-requests=36",
                  "--max-input-tokens=80000", "--reserve-input-tokens=2000",
                  "--max-usd=0.004", "--concurrency=1",
              ],
              "jev-direction-sample.yml": [
                  "--horizon=8", "--profile=lean", "--decision-every=8",
                  "--sample=240", "--min-cache-hits=48", "--max-requests=192",
                  "--max-input-tokens=384000", "--reserve-input-tokens=2000",
                  "--max-usd=0.017", "--concurrency=1",
              ],
              "jev-direction-sample-1000.yml": [
                  "--horizon=8", "--profile=lean", "--decision-every=8",
                  "--sample=1000", "--min-cache-hits=240", "--max-requests=760",
                  "--max-input-tokens=1520000", "--reserve-input-tokens=2000",
                  "--max-usd=0.065", "--concurrency=1",
              ],
              "jev-direction-development.yml": [
                  "--model=jev-direction", "--horizons=8", "--profiles=lean",
                  "--decision-every=8", "--direction-only=true",
                  "--max-new-evals=5996", "--max-paid-requests=5996",
                  "--max-input-tokens=11992000", "--reserve-tokens-per-request=2000",
                  "--max-usd=0.505", "--concurrency=1",
              ],
              "jev-direction-sealed.yml": [
                  "--max-new-evals=1752", "--max-paid-requests=1752",
                  "--max-input-tokens=3504000", "--reserve-tokens-per-request=2000",
                  "--max-usd=0.15", "--concurrency=1",
              ],
          }
          failures = []
          staged_caps = {
              "jev-direction-canary.yml": (12, 0.0015),
              "jev-direction-sample-48.yml": (36, 0.004),
              "jev-direction-sample.yml": (192, 0.017),
              "jev-direction-sample-1000.yml": (760, 0.065),
              "jev-direction-development.yml": (5996, 0.505),
              "jev-direction-sealed.yml": (1752, 0.15),
          }
          if sum(v[0] for v in staged_caps.values()) != 8748:
              failures.append("staged paid request ceiling changed from 8,748")
          if sum(v[1] for v in staged_caps.values()) > 0.75:
              failures.append("staged paid research dollar ceiling exceeds $0.75")
          disabled_guard = "if: $" + "{{ false }}"
          duplicate_disabled_guard = disabled_guard + "\n    if:"

          for path in sorted(root.glob("*.y*ml")):
              if path.name == "jev-workflow-safety.yml":
                  continue
              text = path.read_text()
              if "TYPESAFE_AI_API_KEY" not in text:
                  continue

              if duplicate_disabled_guard in text:
                  failures.append(f"{path.name}: duplicate job-level if after hard-disable")

              if path.name in allowed:
                  if "workflow_dispatch:" not in text:
                      failures.append(f"{path.name}: must remain manual-only")
                  if re.search(r"^  (push|schedule):", text, re.M):
                      failures.append(f"{path.name}: automatic trigger forbidden")
                  if not re.search(r"confirm_spend:", text):
                      failures.append(f"{path.name}: explicit spend confirmation missing")
                  if path.name != "jev-direction-canary.yml":
                      if "dashboard_request_delta:" not in text:
                          failures.append(f"{path.name}: provider request-delta reconciliation input missing")
                      if "dashboard_input_token_delta:" not in text:
                          failures.append(f"{path.name}: provider input-token reconciliation input missing")
                  if "--max-usd=" not in text:
                      failures.append(f"{path.name}: explicit hard dollar cap missing")
                  if "--concurrency=1" not in text:
                      failures.append(f"{path.name}: paid calls must remain serial")
                  if re.search(r"^    env:\n      TYPESAFE_AI_API_KEY:", text, re.M):
                      failures.append(f"{path.name}: Jev secret exposed at job scope")
                  for required in exact.get(path.name, []):
                      if required not in text:
                          failures.append(f"{path.name}: missing pinned safety requirement: {required}")
              else:
                  if disabled_guard not in text:
                      failures.append(f"{path.name}: legacy paid workflow is not hard-disabled")

          if failures:
              for failure in failures:
                  print("FAIL", failure)
              sys.exit(1)
          print("Paid Jev workflow safety audit passed.")
