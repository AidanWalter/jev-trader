name: jev-stock-portfolio-pilot

on:
  workflow_dispatch:
    inputs:
      selection_date:
        description: Historical date used to choose the liquid U.S. stock universe
        required: true
        default: "2025-01-02"
      from:
        description: First trading date, must be after selection_date
        required: true
        default: "2025-01-03"
      to:
        description: Final historical date
        required: true
        default: "2025-02-03"
      top:
        description: Number of point-in-time liquid stocks to request
        required: true
        default: "8"
      multiplier:
        description: Polygon aggregate bar size in minutes
        required: true
        default: "15"
      horizons:
        description: Forecast horizons in bars
        required: true
        default: "6,12"
      profiles:
        description: Jev input profiles
        required: true
        default: "technical,path,cross,full"
      decision_every:
        description: Evaluate every N synchronized bars
        required: true
        default: "4"
      top_n:
        description: Maximum simultaneously selected stocks
        required: true
        default: "3"
      max_asset:
        description: Maximum absolute exposure per stock
        required: true
        default: "0.35"
      spread_bps:
        description: Assumed quoted spread per stock
        required: true
        default: "2"
      fee_bps:
        description: Modeled fee/other execution charge per side
        required: true
        default: "1"
      slippage_bps:
        description: Modeled slippage per side
        required: true
        default: "1"
      allow_short:
        description: Allow simulated stock shorts
        required: true
        type: boolean
        default: false
      concurrency:
        description: Maximum concurrent Jev API calls
        required: true
        default: "4"
      max_new_evals:
        description: Hard cap across all fresh Jev calls
        required: true
        default: "12000"
      probe_run_id:
        description: Optional completed jev-stock-portfolio-probe run ID whose exact universe and cache should be reused
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/replay-lab
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Require TypeSafe secret
        run: |
          if [ -z "$TYPESAFE_AI_API_KEY" ]; then
            echo "TYPESAFE_AI_API_KEY repository secret is not configured"
            exit 1
          fi
      - name: Require Polygon secret when no probe artifact is supplied
        if: ${{ inputs.probe_run_id == '' }}
        run: |
          if [ -z "$POLYGON_API_KEY" ]; then
            echo "POLYGON_API_KEY repository secret is not configured"
            exit 1
          fi
      - name: Build point-in-time liquid stock universe
        if: ${{ inputs.probe_run_id == '' }}
        run: |
          bun run scripts/download-polygon-universe.ts \
            --selection-date="${{ inputs.selection_date }}" \
            --from="${{ inputs.from }}" \
            --to="${{ inputs.to }}" \
            --top="${{ inputs.top }}" \
            --multiplier="${{ inputs.multiplier }}" \
            --timespan=minute \
            --spread-bps="${{ inputs.spread_bps }}" \
            --out-dir=data/market/stock-universe \
            --manifest=data/market/stock-universe/universe.json
      - name: Download optional exact stock probe artifact
        if: ${{ inputs.probe_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: jev-stock-portfolio-probe-${{ inputs.probe_run_id }}
          path: probe
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.probe_run_id }}
      - name: Reuse verified stock probe universe and cache
        if: ${{ inputs.probe_run_id != '' }}
        run: |
          test -s probe/market/stock-universe/universe.json
          test -s probe/stock-portfolio-probe-summary.json
          test -s probe/stock-portfolio-probe-cache.jsonl
          jq -e \
            --arg horizons "${{ inputs.horizons }}" \
            --arg profiles "${{ inputs.profiles }}" \
            --argjson cadence "${{ inputs.decision_every }}" \
            --argjson fee "${{ inputs.fee_bps }}" \
            --argjson slip "${{ inputs.slippage_bps }}" \
            '.horizons == ($horizons | split(",") | map(tonumber)) and
             .profiles == ($profiles | split(",")) and
             .decisionEveryBars == $cadence and
             .execution.feeBps == $fee and
             .execution.slippageBps == $slip' \
            probe/stock-portfolio-probe-summary.json >/dev/null
          jq -e \
            --arg sel "${{ inputs.selection_date }}" \
            --arg from "${{ inputs.from }}" \
            --arg to "${{ inputs.to }}" \
            --argjson top "${{ inputs.top }}" \
            --argjson mult "${{ inputs.multiplier }}" \
            '.selectionDate == $sel and .from == $from and .to == $to and .requestedTop == $top and .multiplier == $mult' \
            probe/market/stock-universe/universe.json >/dev/null
          mkdir -p data/market
          cp -R probe/market/stock-universe data/market/stock-universe
          ACTUAL="$(bun -e 'import { fingerprintUniverse } from "./research/universe"; console.log(fingerprintUniverse("data/market/stock-universe/universe.json").combinedSha256)')"
          PROBE="$(jq -r '.fingerprint.combinedSha256' probe/stock-portfolio-probe-summary.json)"
          if [ "$ACTUAL" != "$PROBE" ]; then
            echo "Stock probe universe fingerprint does not match copied universe"
            exit 1
          fi
          cp probe/stock-portfolio-probe-cache.jsonl data/stock-portfolio-pilot-cache.jsonl
          echo "Reusing exact stock universe and cache from probe run ${{ inputs.probe_run_id }}"
      - name: Run development-only Jev stock portfolio pilot
        run: |
          bun run research/portfolio-pilot.ts data/market/stock-universe/universe.json \
            --model=jev \
            --require-complete-grid=true \
            --concurrency="${{ inputs.concurrency }}" \
            --horizons="${{ inputs.horizons }}" \
            --profiles="${{ inputs.profiles }}" \
            --decision-every="${{ inputs.decision_every }}" \
            --top-n="${{ inputs.top_n }}" \
            --max-gross=1 \
            --max-asset="${{ inputs.max_asset }}" \
            --spread-bps="${{ inputs.spread_bps }}" \
            --fee-bps="${{ inputs.fee_bps }}" \
            --slippage-bps="${{ inputs.slippage_bps }}" \
            --allow-short="${{ inputs.allow_short }}" \
            --max-new-evals="${{ inputs.max_new_evals }}" \
            --cache=data/stock-portfolio-pilot-cache.jsonl \
            --out=data/stock-portfolio-pilot-summary.json
      - name: Tune shared-bankroll stock apparatus from cache
        run: |
          bun run research/tune-portfolio-apparatus.ts data/market/stock-universe/universe.json \
            --pilot=data/stock-portfolio-pilot-summary.json \
            --cache=data/stock-portfolio-pilot-cache.jsonl \
            --grid=full \
            --out=data/stock-portfolio-apparatus-selection.json
      - name: Freeze only if validation qualification passes
        run: |
          bun run research/freeze-portfolio.ts data/market/stock-universe/universe.json \
            --selection=data/stock-portfolio-apparatus-selection.json \
            --out=data/stock-portfolio-apparatus-freeze.json
      - name: Zero-spend stock sealed-test preflight
        if: ${{ success() }}
        run: |
          bun run research/portfolio-sealed-preflight.ts data/stock-portfolio-apparatus-freeze.json \
            --manifest=data/market/stock-universe/universe.json \
            --cache=data/stock-portfolio-pilot-cache.jsonl | tee data/stock-portfolio-sealed-preflight.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-stock-portfolio-pilot-${{ github.run_id }}
          path: |
            data/market/stock-universe/
            data/stock-portfolio-pilot-cache.jsonl
            data/stock-portfolio-pilot-summary.json
            data/stock-portfolio-apparatus-selection.json
            data/stock-portfolio-apparatus-freeze.json
            data/stock-portfolio-sealed-preflight.txt
          retention-days: 30
