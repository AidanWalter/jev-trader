name: research-check

on:
  push:
    branches:
      - research/replay-lab
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Replay smoke test
        run: bun run research:check
      - name: Portfolio replay smoke test
        run: bun run research:check-portfolio
      - name: Stock session execution regression
        run: bun run research:check-stock-session
      - name: Perpetual funding regression
        run: bun run research:check-perp-funding
      - name: Cross-sectional feature regression
        run: bun run research:check-feature-context
      - name: Live boundary timing regression
        run: bun run research:check-live-boundary
      - name: Concurrent cache budget regression
        run: bun run research:check-cache-concurrency
      - name: Paid spend-cap and direction-only regression
        run: bun run research:check-spend-budget
      - name: Safe Jev budget and direction-only regression
        run: bun run research:check-safe-jev
      - name: Paid workflow safety audit
        run: bun run research:check-paid-workflows
      - name: Live paid-spend persistence audit
        run: bun run research:check-live-spend-safety
      - name: Fill ordering regression
        run: bun run scripts/check-fill-order.ts
