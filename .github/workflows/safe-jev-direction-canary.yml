name: safe-jev-direction-canary

on:
  workflow_dispatch:
    inputs:
      probe_run_id:
        description: Successful safe-jev-direction-probe workflow run ID
        required: true
      confirm_budget:
        description: Type VERIFIED_12_AND_APPROVE_120 to allow this paid canary
        required: true
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  canary:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/replay-lab
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Download fixed generation-two market data
        uses: actions/download-artifact@v4
        with:
          pattern: generation2-free-scan-35388923207
          path: data/g2-market
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35388923207
      - name: Download verified 12-request probe cache
        uses: actions/download-artifact@v4
        with:
          pattern: safe-jev-direction-probe-v1
          path: data/probe
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.probe_run_id }}
      - name: Verify probe and restore cache
        run: |
          test -s data/g2-market/universe/universe.json
          test -s data/probe/safe-direction-probe.json
          test -s data/probe/safe-direction-cache.jsonl
          jq -e '
            .version == "safe-jev-direction-probe-v1" and
            .horizonBars == 8 and
            .profile == "lean" and
            .decisionEveryBars == 8 and
            .sampleCount == 12 and
            .budget.requestsStarted <= 12
          ' data/probe/safe-direction-probe.json >/dev/null
          mkdir -p data/g2
          cp data/probe/safe-direction-cache.jsonl data/g2/safe-direction-cache.jsonl
      - name: Refuse duplicate canary expansion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="safe-jev-direction-canary-probe-${{ inputs.probe_run_id }}"
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME" --jq '.total_count')"
          if [ "$COUNT" != "0" ]; then
            echo "$NAME already exists; refusing duplicate paid canary"
            exit 1
          fi
      - name: Paid 120-state Jev direction canary
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
        run: |
          test -n "$TYPESAFE_AI_API_KEY"
          bun run research/safe-jev-direction-probe.ts data/g2-market/universe/universe.json \
            --horizon=8 \
            --profile=lean \
            --decision-every=8 \
            --sample=120 \
            --max-requests=120 \
            --max-input-tokens=300000 \
            --reserve-input-tokens=2000 \
            --max-usd=0.015 \
            --concurrency=1 \
            --cache=data/g2/safe-direction-cache.jsonl \
            --out=data/g2/safe-direction-canary.json | tee data/g2/safe-direction-canary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-jev-direction-canary-probe-${{ inputs.probe_run_id }}
          path: |
            data/g2/safe-direction-cache.jsonl
            data/g2/safe-direction-canary.json
            data/g2/safe-direction-canary.txt
          retention-days: 30
