name: jev-stock-portfolio-probe

on:
  workflow_dispatch:
    inputs:
      selection_date:
        description: Historical date used to choose the liquid U.S. stock universe
        required: true
        default: "2025-01-02"
      from:
        description: First trading date, must be after selection_date
        required: true
        default: "2025-01-03"
      to:
        description: Final historical date
        required: true
        default: "2025-02-03"
      top:
        description: Number of point-in-time liquid stocks to request
        required: true
        default: "8"
      multiplier:
        description: Polygon aggregate bar size in minutes
        required: true
        default: "15"
      horizons:
        description: Forecast horizons in bars
        required: true
        default: "6,12"
      profiles:
        description: Jev input profiles
        required: true
        default: "technical,path,cross,full"
      decision_every:
        description: Evaluate every N synchronized bars
        required: true
        default: "4"
      concurrency:
        description: Maximum concurrent Jev API calls
        required: true
        default: "4"
      sample_per_cell:
        description: Fresh Jev calls sampled per horizon/profile cell
        required: true
        default: "6"
      spread_bps:
        description: Assumed quoted spread per stock
        required: true
        default: "2"
      fee_bps:
        description: Modeled fee/other execution charge per side
        required: true
        default: "1"
      slippage_bps:
        description: Modeled slippage per side
        required: true
        default: "1"
      max_new_evals:
        description: Hard cap across the probe
        required: true
        default: "48"

permissions:
  contents: read

jobs:
  probe:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/replay-lab
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Require secrets
        run: |
          if [ -z "$TYPESAFE_AI_API_KEY" ]; then
            echo "TYPESAFE_AI_API_KEY repository secret is not configured"
            exit 1
          fi
          if [ -z "$POLYGON_API_KEY" ]; then
            echo "POLYGON_API_KEY repository secret is not configured"
            exit 1
          fi
      - name: Build point-in-time liquid stock universe
        run: |
          bun run scripts/download-polygon-universe.ts \
            --selection-date="${{ inputs.selection_date }}" \
            --from="${{ inputs.from }}" \
            --to="${{ inputs.to }}" \
            --top="${{ inputs.top }}" \
            --multiplier="${{ inputs.multiplier }}" \
            --timespan=minute \
            --spread-bps="${{ inputs.spread_bps }}" \
            --out-dir=data/market/stock-universe \
            --manifest=data/market/stock-universe/universe.json
      - name: Measure Jev stock-universe tokens latency and projected spend
        run: |
          bun run research/portfolio-probe.ts data/market/stock-universe/universe.json \
            --model=jev \
            --concurrency="${{ inputs.concurrency }}" \
            --horizons="${{ inputs.horizons }}" \
            --profiles="${{ inputs.profiles }}" \
            --decision-every="${{ inputs.decision_every }}" \
            --sample-per-cell="${{ inputs.sample_per_cell }}" \
            --fee-bps="${{ inputs.fee_bps }}" \
            --slippage-bps="${{ inputs.slippage_bps }}" \
            --max-new-evals="${{ inputs.max_new_evals }}" \
            --cache=data/stock-portfolio-probe-cache.jsonl \
            --out=data/stock-portfolio-probe-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-stock-portfolio-probe-${{ github.run_id }}
          path: |
            data/market/stock-universe/
            data/stock-portfolio-probe-cache.jsonl
            data/stock-portfolio-probe-summary.json
          retention-days: 30
