name: jev-direction-sample

on:
  workflow_dispatch:
    inputs:
      sample48_run_id:
        description: Successful jev-direction-sample-48 run ID whose TypeSafe dashboard usage you personally verified
        required: true
      dashboard_verified:
        description: I checked TypeSafe billing for the 48-state stage and it matched the artifact closely
        required: true
        type: boolean
        default: false
      dashboard_request_delta:
        description: Exact TypeSafe request-count increase caused by the 48-state stage
        required: true
      dashboard_input_token_delta:
        description: TypeSafe input-token increase caused by the 48-state stage
        required: true
      confirm_spend:
        description: I approve at most 192 fresh requests under a hard $0.017 ledger cap
        required: true
        type: boolean
        default: false
      resume_run_id:
        description: Optional failed jev-direction-sample run ID to resume from its partial cache
        required: false
        default: ""
      resume_dashboard_verified:
        description: I checked TypeSafe billing for the failed attempt before resuming
        required: false
        type: boolean
        default: false
      resume_dashboard_request_delta:
        description: Exact TypeSafe request-count increase caused by the failed attempt
        required: false
        default: "0"
      resume_dashboard_input_token_delta:
        description: Exact TypeSafe input-token increase caused by the failed attempt
        required: false
        default: "0"

permissions:
  contents: read
  actions: read

jobs:
  sample:
    if: ${{ inputs.dashboard_verified == true && inputs.confirm_spend == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c7ae2796ea6c7e01a59522177b150e8c99c34c2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Download personally verified 48-state artifact
        uses: actions/download-artifact@v4
        with:
          pattern: jev-direction-sample48-canary-*
          path: prior
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.sample48_run_id }}

      - name: Verify and restore exact 48-state dataset and cache
        run: |
          set -euo pipefail
          RESULT="$(find prior -name result.json -print -quit)"
          CACHE="$(find prior -name jev-direction-cache.jsonl -print -quit)"
          MANIFEST="$(find prior -path '*/universe/universe.json' -print -quit)"
          REFERENCE_CACHE="$(find prior -type f -name 'reference-full-jev-cache.jsonl' -print -quit)"
          test -n "$RESULT"
          test -n "$CACHE"
          test -n "$MANIFEST"
          test -n "$REFERENCE_CACHE"
          jq -e '
            .version == "safe-jev-direction-probe-v1" and
            .horizonBars == 8 and
            .profile == "lean" and
            .decisionEveryBars == 8 and
            .sampleCount == 48 and
            .preCachedSampleStates >= 12 and
            .freshStatesRequired <= 36 and
            .budget.requestsStarted <= 36 and
            .budget.estimatedUsd <= 0.004 and
            .metrics.avgInputTokens <= 1600 and
            .metrics.brier < 0.80 and
            .metrics.nonFlatCount >= 8 and
            (
              .metrics.calledBpsPerState > 0 or
              (.metrics.confidenceGates | any(
                .n >= 8 and
                .netCalledBpsPerState > 0 and
                .positiveSymbols >= 2
              )) or
              (.metrics.edgeGates | any(
                .n >= 8 and
                .netCalledBpsPerState > 0 and
                .positiveSymbols >= 2
              ))
            )
          ' "$RESULT" >/dev/null
          OBS_REQ="${{ inputs.dashboard_request_delta }}"
          OBS_TOK="${{ inputs.dashboard_input_token_delta }}"
          [[ "$OBS_REQ" =~ ^[0-9]+$ ]]
          [[ "$OBS_TOK" =~ ^[0-9]+$ ]]
          EXP_REQ="$(jq -r '.budget.requestsStarted' "$RESULT")"
          EXP_TOK="$(jq -r '.budget.inputTokens' "$RESULT")"
          if [ "$OBS_REQ" -ne "$EXP_REQ" ]; then
            echo "TypeSafe request delta $OBS_REQ does not equal artifact request count $EXP_REQ"
            exit 1
          fi
          LOW=$((EXP_TOK * 95 / 100))
          HIGH=$((EXP_TOK * 105 / 100 + 100))
          if [ "$OBS_TOK" -lt "$LOW" ] || [ "$OBS_TOK" -gt "$HIGH" ]; then
            echo "TypeSafe input-token delta $OBS_TOK does not reconcile with artifact $EXP_TOK (allowed $LOW..$HIGH)"
            exit 1
          fi
          echo "Provider billing reconciled: $OBS_REQ requests and $OBS_TOK input tokens."
          mkdir -p data/sample
          cp -R "$(dirname "$MANIFEST")" data/sample/universe
          cp "$CACHE" data/sample/jev-direction-cache.jsonl
          cp "$RESULT" data/sample/sample48.json
          cp "$REFERENCE_CACHE" data/sample/reference-full-jev-cache.jsonl

      - name: Print zero-call expanded sample budget
        run: |
          echo "Hard limits: 192 fresh requests, 384000 input tokens, $0.017."
          echo "The first 48 deterministic states are already cached from the verified prior stage."
          echo "The remaining 192 fresh requests reserve at most 384000 tokens = $0.016128 at $0.042/MTok."

      - name: Download optional failed-stage partial cache
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: jev-direction-sample-failed-${{ inputs.resume_run_id }}
          path: resume
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Restore partial cache and compute remaining lifetime stage budget
        run: |
          set -euo pipefail
          MAX_REQ=192
          MAX_TOK=384000
          USED_REQ=0
          USED_TOK=0
          if [ -n "${{ inputs.resume_run_id }}" ]; then
            if [ "${{ inputs.resume_dashboard_verified }}" != "true" ]; then
              echo "Resume requires explicit TypeSafe dashboard verification."
              exit 1
            fi
            USED_REQ="${{ inputs.resume_dashboard_request_delta }}"
            USED_TOK="${{ inputs.resume_dashboard_input_token_delta }}"
            [[ "$USED_REQ" =~ ^[0-9]+$ ]]
            [[ "$USED_TOK" =~ ^[0-9]+$ ]]
            if [ "$USED_REQ" -gt "$MAX_REQ" ] || [ "$USED_TOK" -gt "$MAX_TOK" ]; then
              echo "Failed attempt already exceeded the lifetime 240-state cap."
              exit 1
            fi
            PARTIAL="$(find resume -type f -name 'jev-direction-cache.jsonl' -print -quit)"
            test -n "$PARTIAL"
            cp "$PARTIAL" data/sample/jev-direction-cache.jsonl
          fi
          REM_REQ=$((MAX_REQ - USED_REQ))
          REM_TOK=$((MAX_TOK - USED_TOK))
          if [ "$REM_REQ" -le 0 ] || [ "$REM_TOK" -lt 2000 ]; then
            echo "No safe paid budget remains for this 240-state stage."
            exit 1
          fi
          echo "S240_REMAINING_REQ=$REM_REQ" >> "$GITHUB_ENV"
          echo "S240_REMAINING_TOK=$REM_TOK" >> "$GITHUB_ENV"
          echo "240-state lifetime cap remaining: $REM_REQ requests and $REM_TOK input tokens."

      - name: Refuse duplicate paid sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="jev-direction-sample-stage48-${{ inputs.sample48_run_id }}"
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME" --jq '.total_count')"
          if [ "$COUNT" != "0" ]; then
            echo "$NAME already exists; refusing duplicate paid sample"
            exit 1
          fi

      - name: Run nested 240-state Jev direction sample
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TYPESAFE_AI_API_KEY"
          bun run research/safe-jev-direction-probe.ts data/sample/universe/universe.json \
            --horizon=8 \
            --profile=lean \
            --decision-every=8 \
            --sample=240 \
            --min-cache-hits=48 \
            --max-requests="$S240_REMAINING_REQ" \
            --max-input-tokens="$S240_REMAINING_TOK" \
            --reserve-input-tokens=2000 \
            --max-usd=0.017 \
            --usd-per-mtok=0.042 \
            --concurrency=1 \
            --reference-cache=data/sample/reference-full-jev-cache.jsonl \
            --reference-profile=path \
            --reference-model=jev \
            --cache=data/sample/jev-direction-cache.jsonl \
            --out=data/sample/jev-direction-sample.json | tee data/sample/sample-output.txt

      - name: Verify true nested expansion
        run: |
          jq -e --slurpfile prior data/sample/sample48.json '
            .sampleCount == 240 and
            .preCachedSampleStates >= 48 and
            .freshStatesRequired <= 192 and
            .budget.requestsStarted <= 192 and
            (.sampleStateIds[0:48] == $prior[0].sampleStateIds)
          ' data/sample/jev-direction-sample.json >/dev/null

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jev-direction-sample-stage48-${{ inputs.sample48_run_id }}
          path: |
            data/sample/universe/
            data/sample/sample48.json
            data/sample/jev-direction-cache.jsonl
            data/sample/jev-direction-sample.json
            data/sample/sample-output.txt
            data/sample/reference-full-jev-cache.jsonl
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jev-direction-sample-failed-${{ github.run_id }}
          path: |
            data/
          retention-days: 14
