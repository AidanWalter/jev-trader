name: research-realdata

on:
  push:
    branches:
      - research/replay-lab
    paths:
      - .github/workflows/research-realdata.yml
      - research/**
      - scripts/download-binance-klines.ts
      - scripts/download-binance-perp-universe.ts
      - scripts/download-yahoo-chart.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btc-public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Download fixed BTC sample
        run: bun run scripts/download-binance-klines.ts --symbol=BTCUSDT --interval=15m --start=2025-01-01 --end=2025-02-01 --out=data/market/btc.csv
      - name: Probe command smoke test with mock evaluator
        run: |
          bun run research/jev-probe.ts data/market/btc.csv \
            --symbol=BTCUSDT \
            --kind=spot \
            --model=mock \
            --horizons=6,12 \
            --profiles=full \
            --decision-every=8 \
            --sample-per-cell=3 \
            --max-new-evals=6 \
            --cache=data/mock-probe-cache.jsonl \
            --out=data/mock-probe-summary.json
          test -s data/mock-probe-summary.json
      - name: Pilot matrix smoke test with mock evaluator
        run: bun run research/pilot.ts data/market/btc.csv --symbol=BTCUSDT --kind=spot --model=mock --horizons=6,12 --profiles=full --decision-every=8 --max-new-evals=100000 --cache=data/mock-pilot-cache.jsonl --out=data/mock-pilot-summary.json
      - name: Mock apparatus selection
        run: |
          bun run research/tune-apparatus.ts data/market/btc.csv \
            --pilot=data/mock-pilot-summary.json \
            --cache=data/mock-pilot-cache.jsonl \
            --grid=fast \
            --out=data/mock-apparatus-selection.json
      - name: Freeze mock apparatus
        run: |
          bun run research/freeze.ts data/market/btc.csv \
            --policy=data/mock-apparatus-selection.json \
            --symbol=BTCUSDT \
            --kind=spot \
            --allow-unqualified=true \
            --out=data/mock-apparatus-freeze.json
      - name: Mock sealed preflight
        run: |
          bun run research/sealed-preflight.ts data/mock-apparatus-freeze.json \
            --data=data/market/btc.csv \
            --cache=data/mock-pilot-cache.jsonl | tee data/mock-sealed-preflight.txt
      - name: Mock sealed execution
        run: |
          set -o pipefail
          bun run research/run-sealed-test.ts data/mock-apparatus-freeze.json \
            --data=data/market/btc.csv \
            --cache=data/mock-pilot-cache.jsonl \
            --max-new-evals=100000 \
            --out=data/mock-sealed-result.json | tee data/mock-sealed-output.txt
      - name: Initialize frozen forward-paper state
        run: |
          bun run research/live-frozen-binance-paper.ts data/mock-apparatus-freeze.json \
            --cache=data/mock-pilot-cache.jsonl \
            --cycles=1 \
            --state=data/mock-frozen-paper-state.json \
            --events=data/mock-frozen-paper-events.jsonl
          test -s data/mock-frozen-paper-state.json
          grep -q '"version": "frozen-binance-paper-v2"' data/mock-frozen-paper-state.json
      - name: Momentum baseline
        run: set -o pipefail; bun run research/run.ts data/market/btc.csv --symbol=BTCUSDT --kind=spot --model=momentum --horizon=12 --decision-every=4 | tee data/momentum.txt
      - name: Random baseline
        run: set -o pipefail; bun run research/run.ts data/market/btc.csv --symbol=BTCUSDT --kind=spot --model=random --horizon=12 --decision-every=4 | tee data/random.txt
      - name: Walk-forward baseline
        run: set -o pipefail; bun run research/walk-forward.ts data/market/btc.csv --symbol=BTCUSDT --kind=spot --model=momentum --horizon=12 --decision-every=4 --train-bars=1000 --validation-bars=400 --step-bars=400 | tee data/walk-forward.txt
      - name: Perfect-foresight viability bound
        run: set -o pipefail; bun run research/oracle-bound.ts data/market/btc.csv --symbol=BTCUSDT --kind=spot --horizons=1,3,6,12,24,48,96 --decision-every=4 | tee data/oracle.txt
      - uses: actions/upload-artifact@v4
        with:
          name: btc-public-data-baselines
          path: |
            data/momentum.txt
            data/random.txt
            data/walk-forward.txt
            data/oracle.txt
            data/mock-probe-summary.json
            data/mock-pilot-summary.json
            data/mock-apparatus-selection.json
            data/mock-apparatus-freeze.json
            data/mock-sealed-preflight.txt
            data/mock-sealed-output.txt
            data/mock-sealed-result.json
            data/mock-frozen-paper-state.json
            data/mock-frozen-paper-events.jsonl
          retention-days: 14

  crypto-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Download synchronized crypto sample
        run: |
          bun run scripts/download-binance-klines.ts --symbol=BTCUSDT --interval=15m --start=2025-01-01 --end=2025-02-01 --out=data/market/btc.csv
          bun run scripts/download-binance-klines.ts --symbol=ETHUSDT --interval=15m --start=2025-01-01 --end=2025-02-01 --out=data/market/eth.csv
          bun run scripts/download-binance-klines.ts --symbol=SOLUSDT --interval=15m --start=2025-01-01 --end=2025-02-01 --out=data/market/sol.csv
      - name: Build universe manifest
        run: |
          cat > data/market/universe.json <<'JSON'
          {
            "name": "btc-eth-sol-15m-2025-01",
            "assets": [
              { "file": "btc.csv", "symbol": "BTCUSDT", "kind": "spot", "spreadBps": 4 },
              { "file": "eth.csv", "symbol": "ETHUSDT", "kind": "spot", "spreadBps": 4 },
              { "file": "sol.csv", "symbol": "SOLUSDT", "kind": "spot", "spreadBps": 5 }
            ]
          }
          JSON
      - name: Mock multi-asset pilot
        run: |
          bun run research/portfolio-pilot.ts data/market/universe.json \
            --model=mock \
            --horizons=6,12 \
            --profiles=full \
            --decision-every=8 \
            --max-new-evals=100000 \
            --top-n=2 \
            --max-gross=1 \
            --max-asset=0.5 \
            --cache=data/mock-portfolio-pilot-cache.jsonl \
            --out=data/mock-portfolio-pilot-summary.json
      - name: Mock multi-asset apparatus selection
        run: |
          bun run research/tune-portfolio-apparatus.ts data/market/universe.json \
            --pilot=data/mock-portfolio-pilot-summary.json \
            --cache=data/mock-portfolio-pilot-cache.jsonl \
            --grid=fast \
            --out=data/mock-portfolio-apparatus-selection.json
      - name: Freeze mock multi-asset apparatus
        run: |
          bun run research/freeze-portfolio.ts data/market/universe.json \
            --selection=data/mock-portfolio-apparatus-selection.json \
            --allow-unqualified=true \
            --out=data/mock-portfolio-apparatus-freeze.json
      - name: Mock multi-asset sealed preflight
        run: |
          bun run research/portfolio-sealed-preflight.ts data/mock-portfolio-apparatus-freeze.json \
            --manifest=data/market/universe.json \
            --cache=data/mock-portfolio-pilot-cache.jsonl | tee data/mock-portfolio-sealed-preflight.txt
      - name: Mock multi-asset sealed execution
        run: |
          set -o pipefail
          bun run research/run-portfolio-sealed-test.ts data/mock-portfolio-apparatus-freeze.json \
            --manifest=data/market/universe.json \
            --cache=data/mock-portfolio-pilot-cache.jsonl \
            --max-new-evals=100000 \
            --out=data/mock-portfolio-sealed-result.json | tee data/mock-portfolio-sealed-output.txt
      - name: Initialize frozen shared-bankroll live paper state
        run: |
          bun run research/live-frozen-binance-portfolio-paper.ts data/mock-portfolio-apparatus-freeze.json \
            --cache=data/mock-portfolio-pilot-cache.jsonl \
            --cycles=1 \
            --state=data/mock-portfolio-live-state.json \
            --events=data/mock-portfolio-live-events.jsonl
          test -s data/mock-portfolio-live-state.json
          test -s data/mock-portfolio-live-events.jsonl
          grep -q '"version": "frozen-binance-portfolio-paper-v2"' data/mock-portfolio-live-state.json
      - name: Momentum portfolio
        run: set -o pipefail; bun run research/run-portfolio.ts data/market/universe.json --model=momentum --horizon=12 --decision-every=4 --top-n=2 --max-gross=1 --max-asset=0.5 | tee data/portfolio-momentum.txt
      - name: Random portfolio
        run: set -o pipefail; bun run research/run-portfolio.ts data/market/universe.json --model=random --horizon=12 --decision-every=4 --top-n=2 --max-gross=1 --max-asset=0.5 | tee data/portfolio-random.txt
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-portfolio-baselines
          path: |
            data/portfolio-momentum.txt
            data/portfolio-random.txt
            data/mock-portfolio-pilot-summary.json
            data/mock-portfolio-apparatus-selection.json
            data/mock-portfolio-apparatus-freeze.json
            data/mock-portfolio-sealed-preflight.txt
            data/mock-portfolio-sealed-output.txt
            data/mock-portfolio-sealed-result.json
            data/mock-portfolio-live-state.json
            data/mock-portfolio-live-events.jsonl
          retention-days: 14

  public-perp-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Download public USDT perpetuals with funding
        run: |
          bun run scripts/download-binance-perp-universe.ts \
            --symbols=BTCUSDT,ETHUSDT,SOLUSDT \
            --interval=15m \
            --start=2025-01-01 \
            --end=2025-02-01 \
            --out-dir=data/market/perp-universe \
            --manifest=data/market/perp-universe/universe.json
      - name: Verify funding data
        run: |
          test -s data/market/perp-universe/universe.json
          jq -e '[.assets[].fundingObservations] | add > 0' data/market/perp-universe/universe.json >/dev/null
          bun -e 'import { readFileSync, readdirSync } from "node:fs"; const fs=readdirSync("data/market/perp-universe").filter(x=>x.endsWith(".csv")); let nonzero=0; for(const f of fs){ for(const line of readFileSync("data/market/perp-universe/"+f,"utf8").split("\n").slice(1)){ const x=Number(line.split(",").at(-1)); if(Number.isFinite(x)&&x!==0) nonzero++; } } if(!nonzero) throw new Error("no nonzero funding bars"); console.log("nonzero funding bars",nonzero);'
      - name: Replay mock perpetual portfolio with real funding
        run: |
          set -o pipefail
          bun run research/run-portfolio.ts data/market/perp-universe/universe.json \
            --model=mock \
            --horizon=12 \
            --decision-every=4 \
            --top-n=2 \
            --max-gross=1 \
            --max-asset=0.5 \
            --allow-short=true | tee data/perp-portfolio.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-perp-portfolio-smoke
          path: |
            data/market/perp-universe/universe.json
            data/perp-portfolio.txt
          retention-days: 14

  public-stock-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Download recent public intraday stock bars
        run: |
          bun run scripts/download-yahoo-chart.ts --ticker=SPY --interval=15m --from=2026-08-20 --to=2026-09-16 --out=data/market/spy.csv
          bun run scripts/download-yahoo-chart.ts --ticker=QQQ --interval=15m --from=2026-08-20 --to=2026-09-16 --out=data/market/qqq.csv
          bun run scripts/download-yahoo-chart.ts --ticker=AAPL --interval=15m --from=2026-08-20 --to=2026-09-16 --out=data/market/aapl.csv
      - name: Build public stock universe
        run: |
          cat > data/market/stock-public-universe.json <<'JSON'
          {
            "name": "yahoo-public-stock-smoke-15m",
            "provider": "yahoo-chart-fallback",
            "assets": [
              { "file": "spy.csv", "symbol": "SPY", "kind": "stock", "spreadBps": 2 },
              { "file": "qqq.csv", "symbol": "QQQ", "kind": "stock", "spreadBps": 2 },
              { "file": "aapl.csv", "symbol": "AAPL", "kind": "stock", "spreadBps": 2 }
            ]
          }
          JSON
      - name: Mock stock portfolio pilot
        run: |
          bun run research/portfolio-pilot.ts data/market/stock-public-universe.json \
            --model=mock \
            --horizons=6,12 \
            --profiles=full \
            --decision-every=4 \
            --top-n=2 \
            --max-gross=1 \
            --max-asset=0.5 \
            --spread-bps=2 \
            --fee-bps=1 \
            --slippage-bps=1 \
            --allow-short=false \
            --max-new-evals=100000 \
            --cache=data/mock-stock-public-cache.jsonl \
            --out=data/mock-stock-public-pilot.json
      - name: Tune and freeze mock stock apparatus
        run: |
          bun run research/tune-portfolio-apparatus.ts data/market/stock-public-universe.json \
            --pilot=data/mock-stock-public-pilot.json \
            --cache=data/mock-stock-public-cache.jsonl \
            --grid=fast \
            --out=data/mock-stock-public-selection.json
          bun run research/freeze-portfolio.ts data/market/stock-public-universe.json \
            --selection=data/mock-stock-public-selection.json \
            --allow-unqualified=true \
            --out=data/mock-stock-public-freeze.json
      - name: Stock sealed preflight and execution
        run: |
          set -o pipefail
          bun run research/portfolio-sealed-preflight.ts data/mock-stock-public-freeze.json \
            --manifest=data/market/stock-public-universe.json \
            --cache=data/mock-stock-public-cache.jsonl | tee data/mock-stock-public-preflight.txt
          bun run research/run-portfolio-sealed-test.ts data/mock-stock-public-freeze.json \
            --manifest=data/market/stock-public-universe.json \
            --cache=data/mock-stock-public-cache.jsonl \
            --max-new-evals=100000 \
            --out=data/mock-stock-public-sealed.json | tee data/mock-stock-public-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-stock-portfolio-smoke
          path: |
            data/mock-stock-public-pilot.json
            data/mock-stock-public-selection.json
            data/mock-stock-public-freeze.json
            data/mock-stock-public-preflight.txt
            data/mock-stock-public-output.txt
            data/mock-stock-public-sealed.json
          retention-days: 14

  forward-paper-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: One-cycle public-data paper initialization
        run: bun run research/live-binance-paper.ts --symbol=BTCUSDT --interval=5m --model=mock --cycles=1 --state=data/paper-state.json --events=data/paper-events.jsonl
      - name: Validate persistent paper state
        run: |
          test -s data/paper-state.json
          test -s data/paper-events.jsonl
          grep -q '"version": "binance-paper-v2"' data/paper-state.json
      - uses: actions/upload-artifact@v4
        with:
          name: forward-paper-smoke
          path: |
            data/paper-state.json
            data/paper-events.jsonl
          retention-days: 7
